<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A backspin serve needs an open bat and a topspin serve a closed one, about 19 degrees apart. Two sliders, one simulated return, and the map of every shot that lands."
    />
    <title>the bat lied to you</title>
    <link rel="stylesheet" href="./styles.css" />

    <!--
      Every module, declared up front.

      Plain ES modules are discovered by parsing: the browser fetches main.js,
      reads its imports, fetches those, reads theirs. On a link with a 2 s
      round trip that waterfall cost 9.1 s to first interaction. Naming them
      here makes the browser request all seven in parallel on the first round
      trip instead — no bundler, still the same modules. test/build.test.js
      fails if a module is added to src/ and not listed here.
    -->
    <link rel="modulepreload" href="./src/main.js" />
    <link rel="modulepreload" href="./src/contact.js" />
    <link rel="modulepreload" href="./src/copy.js" />
    <link rel="modulepreload" href="./src/map.js" />
    <link rel="modulepreload" href="./src/physics.js" />
    <link rel="modulepreload" href="./src/render.js" />
    <link rel="modulepreload" href="./src/solver.js" />
  </head>
  <body>
    <a class="skip" href="#instrument">skip to the simulation</a>

    <header class="masthead">
      <nav aria-label="Primary">
        <a href="./">the bat lied to you</a>
        <a href="#instrument">return the serve</a>
        <a href="#why">why</a>
        <a href="#map">every shot</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow" data-copy="tagline"></p>
        <h1 data-copy="headline"></h1>
        <p class="standfirst" data-copy="standfirst"></p>
      </section>

      <section id="instrument" aria-labelledby="act-one-heading">
        <h2 id="act-one-heading" data-copy="actOne.heading"></h2>
        <p class="lede" data-copy="actOne.lede"></p>

        <noscript>
          <div class="noscript">
            <p data-copy="noscript"></p>
            <svg
              viewBox="0 0 420 130"
              width="420"
              height="130"
              role="img"
              aria-label="Two bats: against a backspin serve the face is tilted well back; against a topspin serve it is closed over the ball."
            >
              <line x1="20" y1="96" x2="400" y2="96" stroke="#EDF1EE" stroke-width="2" />
              <g stroke="#EDF1EE" stroke-width="6" stroke-linecap="round">
                <line x1="96" y1="34" x2="128" y2="86" />
                <line x1="300" y1="34" x2="284" y2="88" />
              </g>
              <g stroke="#C8102E" stroke-width="3" stroke-linecap="round">
                <line x1="92" y1="37" x2="124" y2="89" />
                <line x1="304" y1="36" x2="288" y2="90" />
              </g>
              <g fill="#8B9793" font-family="monospace" font-size="13">
                <text x="112" y="120" text-anchor="middle">backspin: open</text>
                <text x="292" y="120" text-anchor="middle">topspin: closed</text>
              </g>
            </svg>
          </div>
        </noscript>

        <div class="stage">
          <canvas id="table-view" role="img" aria-label="Side view of the return."></canvas>
          <p class="legend">
            <span class="key key-serve" data-copy="legend.serve"></span>
            <span class="key key-return" data-copy="legend.ret"></span>
            <span class="key key-ghost"></span>
            <span class="key key-mark" data-copy="legend.mark"></span>
          </p>
        </div>

        <div class="controls">
          <fieldset class="serve-picker">
            <legend data-copy="controls.serve"></legend>
            <div class="radios">
              <label>
                <input type="radio" name="serve" value="backspin" checked />
                <span data-copy="controls.backspin"></span>
              </label>
              <label>
                <input type="radio" name="serve" value="topspin" />
                <span data-copy="controls.topspin"></span>
              </label>
            </div>
          </fieldset>

          <div class="slider">
            <label for="bat-angle">
              <span data-copy="controls.batAngle"></span>
              <output id="bat-angle-value" for="bat-angle">0°</output>
              <span id="bat-angle-hint" class="hint"></span>
            </label>
            <input id="bat-angle" type="range" min="-30" max="70" step="1" value="0" />
            <p class="scale">
              <span data-copy="controls.batAngleLow"></span>
              <span data-copy="controls.batAngleHigh"></span>
            </p>
          </div>

          <div class="slider">
            <label for="swing-direction">
              <span data-copy="controls.swing"></span>
              <output id="swing-direction-value" for="swing-direction">5°</output>
              <span id="swing-direction-hint" class="hint"></span>
            </label>
            <input id="swing-direction" type="range" min="-60" max="80" step="1" value="5" />
            <p class="scale">
              <span data-copy="controls.swingLow"></span>
              <span data-copy="controls.swingHigh"></span>
            </p>
          </div>

          <div class="verdict">
            <p id="outcome-label" class="outcome"></p>
            <p id="outcome-detail" class="outcome-detail"></p>
          </div>
        </div>

        <p id="outcome-live" class="visually-hidden" role="status" aria-live="polite"></p>
      </section>

      <section id="why" aria-labelledby="act-two-heading">
        <h2 id="act-two-heading" data-copy="actTwo.heading"></h2>
        <p class="lede" data-copy="actTwo.lede"></p>
        <div class="contact-grid">
          <div class="stage">
            <canvas id="contact-view" role="img" aria-label="The instant of contact."></canvas>
            <p class="legend">
              <span class="key key-slip">the surface sliding</span>
              <span class="key key-grip">friction</span>
              <span class="key key-normal">bounce off the face</span>
            </p>
          </div>
          <div class="contact-side">
            <p id="contact-sentence" class="contact-sentence"></p>
            <dl id="contact-readout" class="readout"></dl>
          </div>
        </div>
        <p class="caption" data-copy="actTwo.caption"></p>
      </section>

      <section id="map" aria-labelledby="act-three-heading">
        <h2 id="act-three-heading" data-copy="actThree.heading"></h2>
        <p class="lede" data-copy="actThree.lede"></p>
        <div class="map-grid">
          <div class="stage">
            <canvas
              id="solution-map"
              role="img"
              aria-label="A map of which settings return the serve."
            ></canvas>
            <p class="legend">
              <span class="key key-in">lands</span>
              <span class="key key-out">long</span>
              <span class="key key-net">net</span>
              <span class="key key-cursor">where you are</span>
            </p>
          </div>
          <div class="map-side">
            <p id="map-summary" class="contact-sentence"></p>
            <dl id="map-readout" class="readout"></dl>
            <label class="ghost-toggle">
              <input id="show-ghost" type="checkbox" checked />
              <span data-copy="actThree.ghostToggle"></span>
            </label>
          </div>
        </div>
        <p id="closing-claim" class="closing"></p>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
